<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Baliza Vital · Panel de incidentes</title>
  <meta name="description" content="Mapa en vivo de incidentes SOS que llegan por el mesh Bluetooth.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='6' fill='%23ef4444'/%3E%3Ccircle cx='16' cy='16' r='12' fill='none' stroke='%23ef4444' stroke-width='2' opacity='.5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="vendor/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="beacon" aria-hidden="true"></span>
      <div>
        <h1>Baliza Vital</h1>
        <p>Emergencias sin internet, por el mesh</p>
      </div>
    </div>
    <div class="stats" id="stats" aria-live="polite"></div>
    <div class="top-actions">
      <span class="conn" id="conn" data-state="connecting"><i></i><span>Conectando…</span></span>
      <button class="btn ghost" id="btn-settings" type="button">Ajustes</button>
    </div>
  </header>

  <main class="layout">
    <aside class="panel list-panel" aria-label="Incidentes">
      <div class="panel-head">
        <h2>Incidentes</h2>
        <div class="seg" role="tablist" aria-label="Filtro">
          <button type="button" role="tab" class="on" data-filter="open">Abiertos</button>
          <button type="button" role="tab" data-filter="all">Todos</button>
        </div>
      </div>
      <ul class="incident-list" id="list"></ul>
    </aside>

    <section class="map-wrap" aria-label="Mapa en vivo">
      <div id="map"></div>
      <div class="legend" aria-hidden="true">
        <span><i style="background:var(--sev3)"></i>Grave</span>
        <span><i style="background:var(--sev2)"></i>Alta</span>
        <span><i style="background:var(--sev1)"></i>Media</span>
        <span><i style="background:var(--closed)"></i>Cerrado</span>
        <span class="acc"><i></i>Precisión</span>
      </div>
    </section>

    <aside class="panel detail-panel" id="detail" aria-label="Detalle del incidente"></aside>
  </main>

  <dialog id="dlg-settings">
    <form method="dialog" class="settings" id="form-settings">
      <h2>Ajustes de conexión</h2>
      <label>URL del backend
        <input name="api" type="url" placeholder="https://tu-servicio.onrender.com" autocomplete="off">
      </label>
      <label>Token del panel <small>(DASHBOARD_TOKEN, si el backend lo exige)</small>
        <input name="token" type="password" autocomplete="off">
      </label>
      <label>Token de administración <small>(ADMIN_TOKEN, solo para las acciones de demo)</small>
        <input name="admin" type="password" autocomplete="off">
      </label>
      <p class="hint">Se guardan solo en este navegador.</p>
      <div class="row">
        <button class="btn ghost" value="cancel" type="submit">Cancelar</button>
        <button class="btn primary" value="save" type="submit">Guardar y reconectar</button>
      </div>
    </form>
  </dialog>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="vendor/leaflet.js"></script>
  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
